name = "Icinga"
grammar = "icinga"
path_suffixes = ["icinga2.conf", "icinga2", "icinga"]
line_comments = ["// ", "# "]
block_comment = ["/* ", " */"]
tab_size = 2
autoclose_before = ";:.,=}])"
word_characters = ["@"]
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "/*", end = " */", close = true, newline = false, not_in = ["string", "comment"] },
]
