/*
 * Icinga 2 configuration example covering most of the language.
 * https://icinga.com/docs/icinga-2/latest/doc/17-language-reference/
 */

include <itl>
include <plugins>
include "constants.conf"
include_recursive "conf.d", "*.conf"
include_zones "director", "zones.d"

library "methods"

const PluginContribDir = "/usr/lib/nagios/plugins"
const ZoneName = NodeName

# Shell-style comment
// C++-style comment

object Endpoint NodeName {
  host = NodeName
  port = 5665
  log_duration = 1d
}

object Zone ZoneName {
  endpoints = [ NodeName, ]
  global = false
}

template Host "generic-host" default {
  max_check_attempts = 3
  check_interval = 1m
  retry_interval = 30s
  check_timeout = 1.5m
  check_command = "hostalive"
}

object Host "web01.example.org" ignore_on_error {
  import "generic-host"

  address = "192.0.2.10"
  address6 = "2001:db8::10"
  display_name = "Web server " + name

  vars.os = "Linux"
  vars.@include = "escaped keyword"
  vars.http_vhosts["https"] = {
    http_uri = "/"
    http_ssl = true
  }
  vars.disks = {
    "disk /" = { disk_partitions = "/" },
    "disk /var" = { disk_partitions = "/var" },
  }
  vars.notification["mail"] = { groups = [ "admins" ] }
  vars.notes = {{{This is a
multi-line string with "quotes" and no escaping}}}
}

apply Service "ping4" {
  import "generic-service"

  check_command = "ping4"
  vars.ping_wrta = 50.5
  vars.ping_crta = 100

  assign where host.address && host.vars.os in [ "Linux", "Windows" ]
  ignore where match("test-*", host.name) || host.vars.os !in [ "Linux" ]
}

apply Service "http-" for (vhost => config in host.vars.http_vhosts) to Host {
  import "generic-service"

  check_command = "http"
  vars += config
  notes = "Checks $host.name$ on port $$80 \"quoted\"\t\\"

  assign where host.vars.http_vhosts
}

apply Notification "mail-icingaadmin" to Service use (prefix = "mail-") {
  import "mail-service-notification"

  user_groups = host.vars.notification.mail.groups
  users = host.vars.notification.mail.users ? host.vars.notification.mail.users : []

  assign where {
    var ok = host.vars.notification.mail
    return ok && service.name != "ping4"
  }
}

object CheckCommand "custom-check" {
  command = [ PluginContribDir + "/check_custom" ]

  arguments = {
    "-H" = "$address$"
    "-w" = {
      value = "$custom_warning$"
      description = "Warning threshold"
      required = true
      set_if = {{ macro("$custom_warning$") != "" }}
    }
  }

  vars.custom_warning = function() use (PluginContribDir) {
    if (typeof(PluginContribDir) == String) {
      return 10
    } else if (PluginContribDir == null) {
      return 20
    } else {
      return -1
    }
  }
}

function count_services(host_name) {
  var count = 0
  for (var service in get_services(host_name)) {
    if (service.state != 0) {
      count += 1
    }
  }
  return count
}

var square = x => x * x
var add = (a, b) => a + b
var shifted = (1 << 4) >> 2 | 3 & ~1 ^ 7 % 4
var ref = &shifted
*ref = -shifted

for (key => value in { a = 1, b = 2 }) {
  log("key " + key + " has value " + string(value))
}

while (false) {
  break
}

try {
  throw "An error occurred."
} except {
  log(LogWarning, "config", "Caught an exception in " + current_filename + ":" + current_line)
}

globals.custom = this.name
locals.temp = 1; locals.other = 2
debugger
